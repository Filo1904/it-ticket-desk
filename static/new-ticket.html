<!DOCTYPE html>
<html lang="it-IT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Ticket Desk</title>
    <link rel="stylesheet" href="/static/common.css">
    <link rel="stylesheet" href="/static/new-ticket.css">
    <script src="/static/new-ticket.js" defer></script>
</head>
<body>
    <div class="header"> 
        <div class="header-left-side">
            <p class="title">IT Ticket Desk</p>
            <p class="subtitle">Gestisci le tue segnalazioni informatiche</p>
        </div>
        <div class="header-right-side">
            <a class="header-link" href="/">⇐ Torna ai ticket</a>
        </div>
    </div>

        <div class="new-ticket-container">
        <p class="new-ticket-title">Nuovo ticket</p>
        <p class="new-ticket-subtitle">Descrivi il problema che stai riscontrando: il team di supporto lo prenderà in carico.</p>
        <div class="new-ticket-form-container">
            <div class="new-ticket-header">
                <p class="new-ticket-header-title">NUOVA RICHIESTA</p>
                <p class="new-ticket-header-status">● Apertura in corso...</p>
            </div>
            <div class="new-ticket-separator">
                <span  class="dot"></span >
                <hr class="line"></hr>
                <span  class="dot"></span >
            </div>
            <form class="ticket-form" id="ticket-form">
                <label class="ticket-name-label" for="ticket-name">Nome del ticket<span class="required"> *</span></label>
                <input class="ticket-name input-field" type="text" id="ticket-name" placeholder="Es. Stampante non funzionante" required minlength="3" maxlength="100">

                <label class="ticket-description-label" for="ticket-description">Descrizione del problema<span class="required"> *</span></label>
                <textarea class="ticket-description input-field" id="ticket-description" placeholder="Descrivi il problema nel dettaglio: cosa è successo, quando e su quale dispositivo" required minlength="10" maxlength="2000"></textarea>

                <label class="ticket-priority-label" for="ticket-priority">Priorità</label>
                <select class="ticket-priority input-field" id="ticket-priority">
                    <option value="bassa">🟢 Bassa</option>
                    <option value="media" selected>🟡 Media</option>
                    <option value="alta">🔴 Alta</option>
                </select>

                <button class="simple-button form-button" type="submit">+ Crea ticket</button>
            </form>
        </div>
    </div>

</body>
</html>
